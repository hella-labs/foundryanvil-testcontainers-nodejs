name: Feature request
description: Suggest an improvement or new API
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing an API or implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or unsupported?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: Show how the proposed API would be used.
      render: typescript

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
