name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [ "22", "24" ]
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version: package.json "packageManager"

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (with coverage)
        run: pnpm test:unit --coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node == '24'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: true

      - name: E2E tests
        run: pnpm test:e2e

  # The built package, consumed via `npm link` by the standalone examples/ project.
  examples:
    name: Examples – npm-link consumer E2E on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ "22", "24" ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version: package.json "packageManager"

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install library dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm build

      # Installs examples/ (npm ci), links the library (project-local npm prefix),
      # then type-checks, lints and unit-tests the examples with coverage.
      - name: Typecheck, lint and unit-test the examples (with coverage)
        run: pnpm examples:unit --coverage

      - name: Run the examples end-to-end (Docker)
        run: pnpm examples:e2e

  # The documentation site (docs/): samples synced from examples/, reference
  # generated from the library, API coverage, site build. Deployed by docs.yml.
  docs:
    name: Docs – samples, API coverage and site build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version: package.json "packageManager"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install library dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm build

      - name: Sync check, typecheck, lint and unit-test the docs (with coverage)
        run: pnpm docs:unit --coverage

      # The examples behind every sample run in the examples job above.
      - name: Build the site and check the built pages
        run: pnpm docs:e2e --skip-examples
